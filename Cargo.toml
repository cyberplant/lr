[package]
name = "lr"
version = "0.1.1"
edition = "2024"
authors = ["cyberplant"]
license = "BSD-3-Clause"
description = "A fast, plugin-driven terminal log reader with dual-FD streaming, SQL queries, and TUI"
repository = "https://github.com/cyberplant/lr"
homepage = "https://github.com/cyberplant/lr"
keywords = ["log", "tui", "tail", "viewer", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
mlua = { version = "0.12.0", features = ["luajit", "vendored"] }
notify = { version = "8.2.0", features = ["macos_kqueue"] }
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
